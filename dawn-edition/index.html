<style>
/* Layout idea: a single-theme (light) broadsheet front page. Nameplate, dateline rule,
   lead story across the top, then sections in ruled columns. Each story is a <details>
   that opens in place. */
:root {
  --paper: #f7f6f1;
  --ink: #141413;
  --muted: #5d5c57;
  --rule: #1c1c1a;
  --hair: #cfcdc4;
  --wash: #ecebe4;
  --accent: #a3161d;
  --display: "Playfair Display", "Times New Roman", Georgia, serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --label: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --nameplate: "UnifrakturMaguntia", "Old English Text MT", "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
a:focus-visible, summary:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.page { max-width: 1180px; margin: 0 auto; padding: 20px 24px 64px; }

/* Nameplate */
.ears { display: flex; justify-content: space-between; gap: 16px; font-family: var(--label); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.nameplate { text-align: center; margin: 6px 0 4px; }
.nameplate h1 { font-family: var(--nameplate); font-weight: 400; font-size: clamp(44px, 8vw, 92px); line-height: 1; margin: 0; letter-spacing: .01em; }
.motto { font-family: var(--body); font-style: italic; color: var(--muted); font-size: 14px; margin-top: 4px; }
.dateline { margin-top: 12px; border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule); padding: 7px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-family: var(--label); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.dateline .tools { display: flex; gap: 8px; }
.dateline button { font: inherit; letter-spacing: inherit; text-transform: inherit; background: transparent; color: var(--ink); border: 1px solid var(--rule); padding: 3px 9px; cursor: pointer; }
.dateline button:hover { background: var(--ink); color: var(--paper); }

/* Section index */
.index { display: flex; flex-wrap: wrap; gap: 4px 18px; justify-content: center; padding: 9px 0; border-bottom: 1px solid var(--hair); font-family: var(--label); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.index a { color: var(--ink); text-decoration: none; }
.index a:hover { color: var(--accent); }

/* Numbers strip */
.numbers { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-bottom: 1px solid var(--rule); }
.num { padding: 10px 14px; border-right: 1px solid var(--hair); }
.num:last-child { border-right: 0; }
.num .k { font-family: var(--label); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.num .v { font-family: var(--display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.num .n { font-size: 12.5px; color: var(--muted); line-height: 1.3; }

/* Stories */
details.story { border: 0; }
details.story > summary { list-style: none; cursor: pointer; }
details.story > summary::-webkit-details-marker { display: none; }
.kicker { font-family: var(--label); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 4px; }
.headline { font-family: var(--display); font-weight: 700; line-height: 1.15; margin: 0 0 6px; text-wrap: balance; }
.dek { margin: 0; color: #2b2b29; }
.more { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-family: var(--label); font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.more::after { content: "+"; font-size: 14px; line-height: 1; }
details[open] .more { color: var(--accent); }
details[open] .more::after { content: "\2212"; }
.more .open-label { display: none; }
details[open] .more .open-label { display: inline; }
details[open] .more .closed-label { display: none; }
summary:hover .headline { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.body { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); }
.body p { margin: 0 0 .8em; max-width: 68ch; }
.why { background: var(--wash); border-left: 3px solid var(--accent); padding: 10px 14px; margin: 4px 0 12px; font-size: 15.5px; max-width: 68ch; }
.why b { font-family: var(--label); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; display: block; margin-bottom: 2px; color: var(--accent); }
.sources { font-family: var(--label); font-size: 12px; color: var(--muted); }
.sources a { color: var(--muted); }
.sources a:hover { color: var(--accent); }

/* Lead */
.lead { display: grid; grid-template-columns: 1fr; padding: 22px 0 20px; border-bottom: 3px double var(--rule); }
.lead .headline { font-size: clamp(30px, 4.4vw, 50px); font-weight: 800; }
.lead .dek { font-size: 20px; line-height: 1.45; max-width: 62ch; }
.lead .body { columns: 2 320px; column-gap: 32px; column-rule: 1px solid var(--hair); }
.lead .body p, .lead .body .why { break-inside: avoid; }

/* Sections */
.sections { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 40px; }
.section { padding-top: 20px; border-bottom: 1px solid var(--rule); padding-bottom: 8px; min-width: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 2px solid var(--rule); padding-bottom: 4px; margin-bottom: 4px; }
.section-head h2 { font-family: var(--label); font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin: 0; }
.section-head .count { font-family: var(--label); font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.section .story { padding: 14px 0; border-bottom: 1px solid var(--hair); }
.section .story:last-child { border-bottom: 0; }
.section .story:first-of-type .headline { font-size: 25px; }
.section .headline { font-size: 21px; }
.section .dek { font-size: 16.5px; }

/* Archive */
.archive { margin-top: 28px; border-top: 3px double var(--rule); padding-top: 12px; }
.archive h2 { font-family: var(--label); font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 8px; }
.archive ul { margin: 0; padding: 0; list-style: none; columns: 2 300px; column-gap: 32px; }
.archive li { padding: 5px 0; border-bottom: 1px solid var(--hair); break-inside: avoid; font-size: 15px; }
.archive li span { font-family: var(--label); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-right: 6px; }
.archive .empty { color: var(--muted); font-style: italic; font-size: 15px; }
.colophon { margin-top: 22px; font-family: var(--label); font-size: 11.5px; color: var(--muted); text-align: center; }

@media (max-width: 760px) {
  .page { padding: 14px 16px 48px; }
  .sections { grid-template-columns: 1fr; }
  .ears { font-size: 10px; }
  .ears span:last-child { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  details[open] > .body { animation: unfold .18s ease-out; }
  @keyframes unfold { from { opacity: .4; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
}
</style>
</head>

<div class="page" id="top">

  <header class="nameplate">

  <div class="numbers" id="numbers"></div>
  <main>
    <article class="lead" id="lead"></article>
    <div class="sections" id="sections"></div>
  </main>
  <section class="archive" id="archive" aria-labelledby="archive-title"></section>
  <p class="colophon" id="colophon"></p>
</div>

(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const count = EDITION.sections.reduce((n, s) => n + s.stories.length, 1);

  $("ear-left").textContent = "Vol. I · No. " + EDITION.number;
  $("ear-right").textContent = "Pretoria · Cape Town · The World";
  $("dateline-text").textContent = EDITION.dateLong + " · " + EDITION.compiled + " · " + count + " stories";

  function storyHTML(s, isLead) {
    const body = s.body.map((p) => "<p>" + esc(p) + "</p>").join("");
    const why = s.why ? '<div class="why"><b>Why it matters</b>' + esc(s.why) + "</div>" : "";
    const src = s.sources && s.sources.length
      ? '<div class="sources">Sources: ' + s.sources.map((x) => '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.name) + "</a>").join(" · ") + "</div>"
      : "";
    const H = isLead ? "h2" : "h3";
    return '<details class="story"><summary>' +
      (s.kicker ? '<span class="kicker">' + esc(s.kicker) + "</span>" : "") +
      "<" + H + ' class="headline">' + esc(s.headline) + "</" + H + ">" +
      '<p class="dek">' + esc(s.dek) + "</p>" +
      '<span class="more"><span class="closed-label">Read more</span><span class="open-label">Close</span></span>' +
      '</summary><div class="body">' + body + why + src + "</div></details>";
  }

  $("lead").innerHTML = storyHTML(EDITION.lead, true);

  $("index").innerHTML = '<a href="#lead">Top story</a>' +
    EDITION.sections.map((s) => '<a href="#' + s.id + '">' + esc(s.name) + "</a>").join("");

  $("numbers").innerHTML = (EDITION.numbers || []).map((n) =>
    '<div class="num"><div class="k">' + esc(n.k) + '</div><div class="v">' + esc(n.v) + '</div><div class="n">' + esc(n.n) + "</div></div>").join("");

  $("sections").innerHTML = EDITION.sections.map((s) =>
    '<section class="section" id="' + s.id + '" aria-labelledby="h-' + s.id + '">' +
    '<div class="section-head"><h2 id="h-' + s.id + '">' + esc(s.name) + '</h2><span class="count">' + s.stories.length + (s.stories.length === 1 ? " story" : " stories") + "</span></div>" +
    s.stories.map((st) => storyHTML(st, false)).join("") + "</section>").join("");

  let arch = '<h2 id="archive-title">Yesterday\'s front page</h2>';
  if (PREVIOUS && PREVIOUS.items && PREVIOUS.items.length) {
    arch += '<p class="sources" style="margin:0 0 8px">' + esc(PREVIOUS.dateLong) + "</p><ul>" +
      PREVIOUS.items.map((i) => "<li><span>" + esc(i.section) + "</span>" + esc(i.headline) + "</li>").join("") + "</ul>";
  } else {
    arch += '<p class="empty">This is the first edition. From tomorrow, the previous day\'s headlines will be listed here.</p>';
  }
  $("archive").innerHTML = arch;

  $("colophon").textContent = "Edition " + EDITION.number + " · Refreshed daily at 06:00 SAST · Click any headline to read more";

  const all = () => document.querySelectorAll("details.story");
  $("expand-all").addEventListener("click", () => all().forEach((d) => (d.open = true)));
  $("collapse-all").addEventListener("click", () => all().forEach((d) => (d.open = false)));
})();
</script>
